<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepsea: '#0f172a',
                        abyss: '#082f49',
                        biolum: '#06b6d4',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(8, 47, 73, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        #board {
            border: 3px solid #a0d8ef;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(79, 209, 255, 0.3);
            background: linear-gradient(145deg, #e0f7fa 0%, #b2ebf2 100%);
        }
        .piece-55d63 {
            filter: drop-shadow(0px 0px 6px rgba(173, 216, 230, 0.9)) 
                    drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.8));
            opacity: 0.95;
            transition: filter 0.2s;
        }
        .square-55d63 {
            transition: background-color 0.2s;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-deepsea to-abyss min-h-screen text-slate-200 font-sans p-6">
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-biolum to-blue-400 mb-2">
                Kraken
            </h1>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">  
            <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center">
                <div id="board" class="w-full max-w-[400px] mb-4 shadow-2xl"></div>
                <h2 id="opening-name" class="text-xl font-semibold text-biolum text-center mt-2">
                    Nenhuma abertura selecionada
                </h2>
            </div>
            <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-medium text-slate-300 mb-4 border-b border-slate-700 pb-2">Parâmetros da Partida</h3>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Rating das Brancas</label>
                            <input type="number" id="w_rating" value="1500" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-biolum">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Rating das Pretas</label>
                            <input type="number" id="b_rating" value="1500" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-biolum">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm text-slate-400 mb-2">Modelo de Predição (.pkl)</label>
                        <div class="flex items-center gap-4">
                            <input type="file" id="model-file" accept=".pkl" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-biolum file:text-deepsea hover:file:bg-cyan-300 cursor-pointer transition-colors">
                        </div>
                    </div>
                </div>
                <div class="flex flex-col gap-3">
                    <button onclick="generateRandomOpening()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded font-medium transition-colors border border-slate-500">
                        Gerar Abertura Aleatória
                    </button>
                    <button onclick="predictOutcome()" class="w-full py-3 bg-gradient-to-r from-biolum to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded font-bold transition-all shadow-lg shadow-cyan-900/50">
                        Prever Resultado
                    </button>
                </div>
                <div id="result-container" class="mt-6 hidden">
                    <div class="p-4 rounded bg-slate-800 border border-slate-600 text-center">
                        <p class="text-sm text-slate-400 mb-1">Previsão do Modelo:</p>
                        <p id="prediction-text" class="text-2xl font-bold text-biolum"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let board = null;
        let currentOpening = "";
        // Aberturas rigorosamente no lance 10 (após o 10º lance das pretas, Brancas jogam o 11º)
        const openings = [
            { name: "King's Indian Defense (Mar del Plata)", fen: "r1bq1rk1/pppnn1bp/3p2p1/3Ppp2/2P1P3/2NN4/PP2BPPP/R1BQ1RK1 w - - 0 11" },
            { name: "King's Indian Defense (Fianchetto)", fen: "r1b1r1k1/pp1n1pbp/1qpp1np1/4p3/2PPP3/2N2NPP/PP3PB1/R1BQR1K1 w - - 1 11" },
            { name: "King's Indian Defense (Sämisch)", fen: "r1bq1rk1/pppnp1bp/3p2p1/5p2/2PPP3/2N1BP2/PP2B1PP/R2QK1NR w KQ - 0 11" },
            { name: "Sicilian Defense (Najdorf, English Attack)", fen: "r2q1rk1/1p1nbppp/p2pbn2/4p3/4P3/1NN1BP2/PPPQ2PP/2KR1B1R w - - 5 11" },
            { name: "Sicilian Defense (Dragon, Yugoslav Attack)", fen: "2rq1rk1/pp1bppbp/2np1np1/8/2BNP3/2N1BP2/PPPQ2PP/2KR3R w - - 5 11" },
            { name: "Sicilian Defense (Alapin)", fen: "r1bqk2r/pp3ppp/2n2n2/3p4/3P4/5N2/PP1NBPPP/R2Q1RK1 w kq - 1 11" },
            { name: "Queen's Gambit Declined (Exchange)", fen: "r1bqrnk1/pp2bppp/2p2n2/3p2B1/3P4/2NBPN2/PPQ2PPP/R4RK1 w - - 6 11" },
            { name: "Ruy Lopez (Closed Chigorin)", fen: "r1bq1rk1/4bppp/p2p1n2/npp1p3/4P3/2P2N1P/PPBP1PP1/RNBQR1K1 w - - 0 11" },
            { name: "Ruy Lopez (Marshall Attack)", fen: "r1bq1rk1/2p1bppp/p7/1p1nn3/8/1BP5/PP1P1PPP/RNBQR1K1 w - - 0 11" },
            { name: "French Defense (Winawer)", fen: "r1b1k1r1/ppq1np1Q/2n1p3/3pP3/3p4/P1P5/2P1NPPP/R1B1KB1R w KQq - 1 11" },
            { name: "French Defense (Advance)", fen: "r3kb1r/pp1bnpp1/1q2p2p/n2pP3/2pP4/P1P2N2/1P1NBPPP/1RBQ1RK1 w kq - 1 11" },
            { name: "Caro-Kann Defense (Advance)", fen: "r2qkb1r/pp1n1ppb/2n1p2p/2ppP3/3P4/2P2N2/PP2BPPP/R1BQNRK1 w kq - 3 11" },
            { name: "Italian Game (Giuoco Piano)", fen: "r1bqr1k1/bpp2pp1/p1np1n1p/4p3/4P3/1BPP1N1P/PP1N1PP1/R1BQR1K1 w - - 3 11" },
            { name: "Slav Defense (Main Line)", fen: "r2q1rk1/pp1n1ppp/2p1pnb1/4N3/PbBP4/2N1P3/1P2QPPP/R1B2RK1 w - - 3 11" },
            { name: "Nimzo-Indian Defense (Rubinstein)", fen: "rn1q1rk1/pb3ppp/1p2pn2/6B1/1bBP4/2N2N2/PP3PPP/R2Q1RK1 w - - 2 11" },
            { name: "Grünfeld Defense (Exchange)", fen: "r2q1rk1/pp1bppbp/2n3p1/2p5/2BPP3/2P1B3/P3NPPP/R2Q1RK1 w - - 3 11" },
            { name: "English Opening (Symmetrical)", fen: "r1bq1rk1/1p2ppbp/p2p1np1/8/2P5/2NQ2P1/PP2PPBP/R1B2RK1 w - - 0 11" },
            { name: "Pirc Defense (Austrian Attack)", fen: "r2q1rk1/ppn1ppbp/3p1np1/2pP4/4PP2/2NB1Q1P/PPP3P1/R1B2RK1 w - - 1 11" },
            { name: "Modern Defense (Averbakh)", fen: "r2qk2r/pppbn1b1/3p1npp/3Ppp2/2P1P2P/2N1BPP1/PP1Q4/R3KBNR w KQkq - 1 11" },
            { name: "Alekhine's Defense (Modern)", fen: "rn1q1rk1/ppp1bppp/1n2p3/2PpP3/3P4/2N1Bb2/PP2BPPP/R2Q1RK1 w - - 0 11" },
            { name: "Scandinavian Defense (Main Line)", fen: "r2qkb1r/pp1n1p1p/2p1pp2/5b2/2BP4/5N2/PPPB1PPP/R2Q1RK1 w kq - 0 11" },
            { name: "Dutch Defense (Leningrad)", fen: "r2q1rk1/pp4bp/n1ppbnp1/5p2/2P5/1PN2NP1/P3PPBP/R1BQ1RK1 w - - 1 11" },
            { name: "Benoni Defense (Modern)", fen: "rnbqr1k1/1p3pbp/p2p1np1/2pP4/4P3/2N5/PP1NBPPP/R1BQ1RK1 w - - 2 11" },
            { name: "Vienna Game (Frankenstein-Dracula)", fen: "N1bk1b1r/p2pq2p/1pnn2p1/3Qpp2/8/1B6/PPPP1PPP/R1B1K1NR w KQ - 0 11" },
            { name: "Scotch Game (Mieses)", fen: "r1b1kb1r/2ppqppp/1np5/4P3/p1P5/1P6/P2NQPPP/R1B1KB1R w KQkq - 0 11" },
            { name: "Trompowsky Attack", fen: "r1bqkb1r/pp3p2/3Pp3/2p3pp/1n2p3/2N1P1B1/PPP2PPP/R2QK1NR w KQkq - 0 11" },
            { name: "Catalan Opening (Open)", fen: "r1b2rk1/pp3ppp/2n1pn2/2b5/8/2P2NP1/P2NPPBP/R1BR2K1 w - - 0 11" },
            { name: "London System", fen: "r2q1rk1/pb2nppp/1p1bpn2/2ppN3/3P1P2/2PBP1B1/PP1N2PP/R2QK2R w KQ - 1 11" },
            { name: "Reti Opening", fen: "r2q1rk1/pp1n1ppp/2p2n2/2b1p2b/4P3/5NPP/PPPNQPB1/R1B2RK1 w - - 1 11" },
            { name: "Bogo-Indian Defense", fen: "rnb2rk1/ppp1qppp/3p1n2/3Pp3/2P1P3/5NP1/PP1N1PBP/R2Q1RK1 w - - 1 11" },
            { name: "Evans Gambit", fen: "r1b1k2r/pppqnppp/1b1p4/n3P3/1QB1P3/2P2N2/P4PPP/RNB2RK1 w kq - 3 11" }
        ];
        function applyOceanTheme() {
            $('#board .square-55d63').each(function() {
                const classes = $(this).attr('class');
                if (/black-/.test(classes)) {
                    $(this).css('background-color', '#7ec8e3');
                } else if (/white-/.test(classes)) {
                    $(this).css('background-color', '#ffffff'); 
                }
            });
        }
        $(document).ready(function() {
            board = Chessboard('board', {
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png',
                position: 'start'
            });
            applyOceanTheme();
        });
        function generateRandomOpening() {
            const randomIndex = Math.floor(Math.random() * openings.length);
            const selected = openings[randomIndex];
            currentOpening = selected.name;
            board.position(selected.fen);
            applyOceanTheme();
            document.getElementById('opening-name').innerText = currentOpening;
            document.getElementById('result-container').classList.add('hidden');
        }
        async function predictOutcome() {
            const wRating = document.getElementById('w_rating').value;
            const bRating = document.getElementById('b_rating').value;
            const fileInput = document.getElementById('model-file');
            if (!currentOpening) {
                alert("Por favor, gere uma abertura primeiro.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("Por favor, selecione o arquivo do modelo (.pkl).");
                return;
            }
            const formData = new FormData();
            formData.append('model', fileInput.files[0]);
            formData.append('w_rating', wRating);
            formData.append('b_rating', bRating);
            formData.append('opening', currentOpening);
            const resultContainer = document.getElementById('result-container');
            const predText = document.getElementById('prediction-text');
            resultContainer.classList.remove('hidden');
            predText.innerText = "Analisando as correntes marítimas...";
            predText.className = "text-2xl font-bold text-slate-400";
            try {
                const response = await fetch('http://127.0.0.1:5000/predict', { 
                    method: 'POST', 
                    body: formData 
                });
                if (!response.ok) {
                    throw new Error(`Erro na requisição: ${response.status}`);
                }
                const data = await response.json();
                if (data.prediction) {
                    predText.innerText = data.prediction;
                    predText.className = "text-2xl font-bold text-biolum";
                } else if (data.error) {
                    predText.innerText = "Erro no modelo: " + data.error;
                    predText.className = "text-2xl font-bold text-red-400";
                }
            } catch (error) {
                predText.innerText = "Erro ao conectar com o backend. O app.py está rodando?";
                predText.className = "text-2xl font-bold text-red-400";
                console.error("Detalhes do erro:", error);
            }
        }
    </script>
</body>
</html>
